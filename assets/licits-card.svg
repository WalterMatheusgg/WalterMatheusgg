<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 200" width="470" height="200" role="img" aria-label="LICITS — gestão e fiscalização de contratos com React e Supabase">
  <title>LICITS</title>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#102A36"/>
      <stop offset="1" stop-color="#142440"/>
    </linearGradient>
    <linearGradient id="brand">
      <stop stop-color="#40D6B0"/>
      <stop offset="1" stop-color="#59B1FB"/>
    </linearGradient>
  </defs>
  <style>
    .pulse{animation:pulse 3.8s ease-in-out infinite alternate}
    .scan{animation:scan 5s linear infinite}
    .ring{animation:spin 20s linear infinite;transform-origin:367px 98px}
    @keyframes pulse{to{opacity:.4}}
    @keyframes scan{0%{transform:translateX(-130px);opacity:0}40%{opacity:.3}90%,100%{transform:translateX(600px);opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="470" height="200" rx="18" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="467" height="197" rx="17" stroke="url(#brand)" stroke-opacity=".7" fill="none"/>
  <path d="M0 166Q200 80 470 148" stroke="#40D6B0" stroke-opacity=".16" fill="none" stroke-width="3"/>
  <circle cx="367" cy="98" r="68" fill="none" stroke="#40D6B0" stroke-opacity=".3" stroke-width="2" stroke-dasharray="10 9" class="ring"/>
  <circle cx="367" cy="98" r="45" fill="none" stroke="#59B1FB" stroke-opacity=".5" stroke-width="2" class="pulse"/>
  <rect x="-120" y="0" width="70" height="200" fill="#40D6B0" opacity=".1" transform="skewX(-18)" class="scan"/>
  <text x="28" y="42" font-family="Consolas,monospace" font-size="12" letter-spacing="2" fill="#40D6B0">PROJETO EM DESTAQUE</text>
  <text x="28" y="96" font-family="Arial,sans-serif" font-weight="800" font-size="38" letter-spacing="1" fill="#F0F7FF">LICITS</text>
  <text x="28" y="127" font-family="Arial,sans-serif" font-weight="700" font-size="14" letter-spacing="1.2" fill="#59B1FB">GESTÃO DE CONTRATOS</text>
  <text x="28" y="166" font-family="Consolas,monospace" font-size="14" fill="#B8D2E6">React · Supabase · PostgreSQL</text>
  <path d="M351 77h32l14 14v37h-46z" fill="none" stroke="#40D6B0" stroke-width="3" stroke-linejoin="round"/>
  <path d="M383 77v15h14M361 105h25M361 115h19" fill="none" stroke="#59B1FB" stroke-width="3" stroke-linecap="round"/>
</svg>
