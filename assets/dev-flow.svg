<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 332" width="1000" height="332" role="img" aria-label="Animação contínua do processo de criação: uma ideia acende, vira código Java e Angular, e se transforma em aplicativo concluído">
  <title>Da ideia ao software — desenvolvimento em movimento</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090E1E"/>
      <stop offset=".55" stop-color="#101D36"/>
      <stop offset="1" stop-color="#11162D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#39E4FF"/><stop offset=".51" stop-color="#9783FF"/><stop offset="1" stop-color="#5CF2BF"/>
    </linearGradient>
    <linearGradient id="editor" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1A2943"/><stop offset="1" stop-color="#10192E"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#44DFFD" stop-opacity=".33"/>
      <stop offset="1" stop-color="#44DFFD" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#84A6C8" opacity=".16"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="332" rx="22"/></clipPath>
  </defs>
  <style>
    .float{animation:float 4s ease-in-out infinite alternate}
    .halo{animation:breath 2.5s ease-in-out infinite alternate}
    .rays{animation:breath 1.8s ease-in-out infinite alternate}
    .orb{animation:spin 15s linear infinite;transform-origin:150px 166px}
    .beam{stroke-dasharray:5 11;animation:flow 2.2s linear infinite}
    .stream1{animation:stream1 3.8s linear infinite}
    .stream2{animation:stream2 3.8s linear infinite -.9s}
    .stream3{animation:stream3 3.8s linear infinite}
    .stream4{animation:stream4 3.8s linear infinite -1.1s}
    .reveal1{animation:reveal1 6s linear infinite}
    .reveal2{animation:reveal2 6s linear infinite}
    .reveal3{animation:reveal3 6s linear infinite}
    .cursor{animation:blink 1s steps(2,end) infinite}
    .deploy{animation:deploy 6s ease-in-out infinite}
    .status{animation:status 6s ease-in-out infinite}
    .shine{animation:shine 6s ease-in-out infinite}
    .bar1{animation:bar1 6s ease-in-out infinite;transform-origin:795px 191px}
    .bar2{animation:bar2 6s ease-in-out infinite;transform-origin:795px 191px}
    .ring{animation:ring 2.8s ease-out infinite;transform-origin:878px 123px}
    @keyframes float{to{transform:translateY(-7px)}}
    @keyframes breath{to{opacity:.42}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes flow{to{stroke-dashoffset:-64}}
    @keyframes stream1{0%{transform:translateX(0);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:translateX(75px);opacity:0}}
    @keyframes stream2{0%{transform:translateX(0);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:translateX(75px);opacity:0}}
    @keyframes stream3{0%{transform:translateX(0);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:translateX(77px);opacity:0}}
    @keyframes stream4{0%{transform:translateX(0);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:translateX(77px);opacity:0}}
    @keyframes reveal1{0%,6%{opacity:0}14%,91%{opacity:1}98%,100%{opacity:0}}
    @keyframes reveal2{0%,20%{opacity:0}30%,91%{opacity:1}98%,100%{opacity:0}}
    @keyframes reveal3{0%,38%{opacity:0}49%,91%{opacity:1}98%,100%{opacity:0}}
    @keyframes blink{50%{opacity:0}}
    @keyframes deploy{0%,48%{opacity:.15;transform:translateY(6px)}67%,91%{opacity:1;transform:translateY(0)}100%{opacity:.15}}
    @keyframes status{0%,52%{opacity:.2}66%,94%{opacity:1}100%{opacity:.2}}
    @keyframes shine{0%,60%{opacity:0;transform:translateX(-50px)}80%{opacity:.8}100%{opacity:0;transform:translateX(180px)}}
    @keyframes bar1{0%,18%{transform:scaleX(.22)}60%,100%{transform:scaleX(1)}}
    @keyframes bar2{0%,28%{transform:scaleX(.14)}70%,100%{transform:scaleX(1)}}
    @keyframes ring{0%{transform:scale(.55);opacity:.75}100%{transform:scale(1.65);opacity:0}}
    @media (prefers-reduced-motion:reduce) {
      .float,.halo,.rays,.orb,.beam,.stream1,.stream2,.stream3,.stream4,.reveal1,.reveal2,.reveal3,.cursor,.deploy,.status,.shine,.bar1,.bar2,.ring{animation:none!important}
      .beam{stroke-dasharray:none}.reveal1,.reveal2,.reveal3,.status,.deploy{opacity:1!important}
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1000" height="332" fill="url(#bg)"/>
    <rect width="1000" height="332" fill="url(#dots)"/>
    <path d="M-10 270C190 210 232 323 456 280S740 340 1020 238" fill="none" stroke="#75A0D1" stroke-opacity=".10" stroke-width="2"/>
    <path d="M0 286C187 224 242 330 465 289S748 350 1020 252" fill="none" stroke="#927CFA" stroke-opacity=".12"/>
    <rect x="2" y="2" width="996" height="328" rx="20" fill="none" stroke="url(#accent)" stroke-opacity=".45" stroke-width="1.5"/>

    <circle cx="31" cy="30" r="4" fill="#55EEBD" class="halo"/>
    <text x="46" y="35" fill="#8AE9FA" font-family="Consolas,monospace" font-size="13" letter-spacing="1.7">CONCEBER  /  CONSTRUIR  /  ENTREGAR</text>
    <text x="965" y="35" text-anchor="end" fill="#87A5C5" font-family="Consolas,monospace" font-size="12">FULL STACK • EM MOVIMENTO</text>

    <!-- Ideia: lâmpada luminosa com órbita e partículas -->
    <circle cx="150" cy="165" r="107" fill="url(#halo)" class="halo"/>
    <circle cx="150" cy="165" r="72" stroke="#4BCCE9" stroke-opacity=".24" stroke-width="1.4" fill="none" stroke-dasharray="6 13" class="orb"/>
    <circle cx="150" cy="165" r="54" fill="#15273C" fill-opacity=".68" stroke="#63C7F0" stroke-opacity=".34" stroke-width="1.6" class="float"/>
    <g stroke="#79E9FF" stroke-linecap="round" class="rays">
      <path d="M150 95v-12M100 112l-9-9M200 112l9-9M79 165H66M221 165h13" stroke-width="3"/>
    </g>
    <g class="float">
      <path d="M129 154a23 23 0 1 1 42 13c-5 7-8 12-8 18h-26c0-6-3-11-8-18a23 23 0 0 1 10-38" fill="#FFE39B" fill-opacity=".18" stroke="#FFDD82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M140 187h20M142 193h16M145 199h10" stroke="#FFE099" stroke-width="3" stroke-linecap="round"/>
      <path d="M144 177l-5-11 11 5 11-5-5 11" stroke="#FFF0B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <circle cx="209" cy="110" r="4" fill="#50E7F4" class="halo"/>
    <circle cx="83" cy="216" r="3" fill="#B8A1FF" class="halo"/>
    <text x="150" y="253" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#F1F7FF">01 · IDEIA</text>
    <text x="150" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#A3B7CD">Entender o problema</text>

    <!-- Conexão: luzes de dados seguindo o caminho -->
    <path d="M241 159H330" stroke="#2C6E98" stroke-width="5" stroke-linecap="round" opacity=".35"/>
    <path d="M241 159H330" class="beam" stroke="#6DE8FF" stroke-width="2" fill="none"/>
    <circle cx="247" cy="159" r="6" fill="#77ECFF" class="stream1"/>
    <circle cx="247" cy="159" r="3" fill="#B69CFF" class="stream2"/>

    <!-- Construção: editor de código no centro, linhas surgindo em sequência -->
    <g class="float">
      <rect x="330" y="71" width="355" height="208" rx="15" fill="url(#editor)" stroke="#6383AC" stroke-opacity=".86" stroke-width="1.4"/>
      <rect x="330" y="71" width="355" height="33" rx="15" fill="#25344E"/>
      <rect x="330" y="90" width="355" height="14" fill="#25344E"/>
      <circle cx="349" cy="87" r="4.3" fill="#FB7F91"/><circle cx="365" cy="87" r="4.3" fill="#F9CF79"/><circle cx="381" cy="87" r="4.3" fill="#6AE6C0"/>
      <text x="420" y="91" font-family="Consolas,monospace" font-size="12" fill="#AEBDD6">Solution.java</text>
      <rect x="592" y="78" width="80" height="17" rx="8" fill="#19443F"/>
      <circle cx="605" cy="86" r="3" fill="#6AF2C5" class="halo"/>
      <text x="615" y="90" font-family="Consolas,monospace" font-size="10.5" fill="#8FECCC">BUILD</text>
      <g font-family="Consolas,monospace" font-size="15">
        <text x="351" y="133" fill="#7089AE">01</text>
        <g class="reveal1"><text x="387" y="133"><tspan fill="#A99BFF">class </tspan><tspan fill="#F4D2A2">Solution</tspan><tspan fill="#DBE8F6"> {</tspan></text></g>
        <text x="351" y="164" fill="#7089AE">02</text>
        <g class="reveal2"><text x="403" y="164"><tspan fill="#6BDCF4">build</tspan><tspan fill="#CBDDEE">(idea) {</tspan></text></g>
        <text x="351" y="195" fill="#7089AE">03</text>
        <g class="reveal3"><text x="419" y="195"><tspan fill="#A99BFF">return </tspan><tspan fill="#6BECBF">software;</tspan></text></g>
        <text x="351" y="226" fill="#7089AE">04</text>
        <g class="reveal3"><text x="403" y="226" fill="#DBE8F6">}</text></g>
        <text x="351" y="257" fill="#7089AE">05</text>
        <g class="reveal3"><text x="387" y="257" fill="#DBE8F6">}</text><rect x="404" y="244" width="8" height="16" rx="1" fill="#75E7D3" class="cursor"/></g>
      </g>
    </g>
    <rect x="426" y="284" width="168" height="21" rx="10" fill="#172C3E"/>
    <text x="510" y="299" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#7BDEF7">JAVA + SPRING + ANGULAR</text>

    <!-- Conexão de deploy -->
    <path d="M687 159H770" stroke="#25566F" stroke-width="5" stroke-linecap="round" opacity=".4"/>
    <path d="M687 159H770" class="beam" stroke="#77ECCD" stroke-width="2" fill="none"/>
    <circle cx="691" cy="159" r="6" fill="#5EF2BE" class="stream3"/>
    <circle cx="691" cy="159" r="3" fill="#A999F9" class="stream4"/>

    <!-- Entrega: app que se constrói e recebe check de sucesso -->
    <g class="deploy">
      <rect x="767" y="89" width="173" height="144" rx="13" fill="#1D3047" stroke="#65D8CF" stroke-width="1.6"/>
      <rect x="767" y="89" width="173" height="26" rx="13" fill="#29435A"/>
      <rect x="767" y="104" width="173" height="11" fill="#29435A"/>
      <circle cx="781" cy="102" r="3.5" fill="#76D9FF"/>
      <circle cx="793" cy="102" r="3.5" fill="#A18AFF"/>
      <rect x="782" y="126" width="50" height="89" rx="5" fill="#1A3E55"/>
      <path d="M791 141h32M791 152h24M791 163h30" stroke="#6CACC7" stroke-width="3" stroke-linecap="round"/>
      <rect x="844" y="129" width="80" height="43" rx="6" fill="#224F5C"/>
      <path d="M854 161l17-13 14 6 23-16" fill="none" stroke="#5FEBC2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="845" y="184" width="78" height="7" rx="3.5" fill="#233F55"/>
      <rect x="845" y="184" width="71" height="7" rx="3.5" fill="#69DFF2" class="bar1"/>
      <rect x="845" y="199" width="78" height="7" rx="3.5" fill="#233F55"/>
      <rect x="845" y="199" width="55" height="7" rx="3.5" fill="#AC98FD" class="bar2"/>
      <rect x="690" y="95" width="46" height="8" fill="#4EEDD1" opacity=".1" transform="skewX(-23)" class="shine"/>
    </g>
    <circle cx="924" cy="113" r="22" fill="#163D41" stroke="#61E8BF" stroke-width="2.4" class="status"/>
    <circle cx="924" cy="113" r="20" fill="none" stroke="#61E8BF" stroke-width="2" class="ring"/>
    <path d="M914 113l7 7 13-15" fill="none" stroke="#74F5CE" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="status"/>
    <text x="853" y="253" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#EFFAF6">03 · ENTREGA</text>
    <text x="853" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#A4BECE">Uma solução funcionando</text>

    <text x="500" y="322" text-anchor="middle" font-family="Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#7491AD">INSPIRAÇÃO  →  ARQUITETURA + CÓDIGO  →  EXPERIÊNCIA REAL</text>
  </g>
</svg>