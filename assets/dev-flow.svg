<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 292" width="1000" height="292" role="img" aria-label="Pipeline animado: concepção, backend Java, frontend Angular e entrega da solução">
<title>Do problema à solução — pipeline de desenvolvimento</title>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0A1428"/><stop offset=".5" stop-color="#111F3D"/><stop offset="1" stop-color="#11182C"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#47CFF2"/><stop offset=".52" stop-color="#9B7BFA"/><stop offset="1" stop-color="#55E7BB"/></linearGradient>
<linearGradient id="bar"><stop stop-color="#56DFF7"/><stop offset="1" stop-color="#9279FF"/></linearGradient>
<pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#89B8F9" stroke-opacity=".06"/></pattern>
</defs>
<style>
 .panel{fill:#172541;stroke:#426082;stroke-opacity:.9;stroke-width:1.2}
 .num{font:700 12px Consolas,monospace;fill:#9AB2CC}
 .head{font:700 18px Arial,sans-serif;fill:#F0F6FF;letter-spacing:.5px}
 .info{font:13px Arial,sans-serif;fill:#9CB4CD}
 .lane{stroke:#376480;stroke-width:2;stroke-dasharray:6 8;animation:road 4s linear infinite}
 .pulse{animation:pulse 2.8s ease-in-out infinite alternate}
 .ping{animation:pop 1.6s ease-in-out infinite alternate}
 .scan{animation:scan 5.6s ease-in-out infinite}
 .a{animation:ping1 4.5s linear infinite}
 .b{animation:ping2 4.5s linear infinite}
 .c{animation:ping3 4.5s linear infinite}
 @keyframes road{to{stroke-dashoffset:-88}}
 @keyframes pulse{to{stroke:#55E5F3;stroke-width:2.5}}
 @keyframes pop{to{opacity:.38}}
 @keyframes scan{0%,100%{opacity:.15}50%{opacity:1}}
 @keyframes ping1{0%,12%{opacity:0;transform:translateX(0)}17%{opacity:1}33%{opacity:0;transform:translateX(28px)}100%{opacity:0}}
 @keyframes ping2{0%,34%{opacity:0;transform:translateX(0)}40%{opacity:1}58%{opacity:0;transform:translateX(28px)}100%{opacity:0}}
 @keyframes ping3{0%,58%{opacity:0;transform:translateX(0)}64%{opacity:1}85%{opacity:0;transform:translateX(28px)}100%{opacity:0}}
 @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1000" height="292" rx="20" fill="url(#bg)"/><rect width="1000" height="292" rx="20" fill="url(#grid)"/>
<rect x="2" y="2" width="996" height="288" rx="20" stroke="url(#edge)" stroke-opacity=".4" fill="none"/>
<text x="36" y="37" font="700 14px Consolas,monospace" fill="#79E8FB" letter-spacing="2">BUILD PIPELINE</text>
<rect x="187" y="23" width="57" height="20" rx="10" fill="#1D403F" stroke="#2E988C"/>
<circle cx="201" cy="33" r="3.5" fill="#64EDC4" class="ping"/><text x="210" y="37" fill="#72E8CB" font="11px Consolas,monospace">LIVE</text>
<text x="962" y="36" text-anchor="end" font="12px Consolas,monospace" fill="#849CB8">IDEIA / CÓDIGO / ENTREGA</text>
<path d="M248 146H274M487 146H513M726 146H752" class="lane"/>
<circle cx="249" cy="146" r="4.5" fill="#57DFF7" class="a"/><circle cx="488" cy="146" r="4.5" fill="#A28EFF" class="b"/><circle cx="727" cy="146" r="4.5" fill="#66F0C8" class="c"/>
<g>
<rect x="35" y="70" width="213" height="169" rx="16" class="panel pulse"/>
<rect x="52" y="88" width="42" height="25" rx="8" fill="#193A4E"/><text x="65" y="105" class="num" fill="#79EDFA">01</text>
<g stroke="#57DFF7" stroke-width="2.5" fill="none"><path d="M188 93L198 103L188 113" class="scan"/><circle cx="182" cy="103" r="15" stroke-opacity=".65"/><circle cx="182" cy="103" r="5" fill="#57DFF7"/></g>
<text x="54" y="149" class="head">DESCOBERTA</text><text x="54" y="175" class="info">Problema e requisitos</text><text x="54" y="195" class="info">transformados em plano</text>
<path d="M54 220H91" stroke="#57DFF7" stroke-width="3" stroke-linecap="round"/><path d="M101 220H156" stroke="#29425A" stroke-width="3" stroke-linecap="round"/>
</g>
<g>
<rect x="274" y="70" width="213" height="169" rx="16" class="panel pulse" style="animation-delay:-.7s"/>
<rect x="291" y="88" width="42" height="25" rx="8" fill="#27304E"/><text x="304" y="105" class="num">02</text>
<g stroke="#AB95FF" stroke-width="2.8" stroke-linecap="round" fill="none"><path d="M422 92l-9 11 9 11M449 92l9 11-9 11M440 88l-13 30" class="scan"/></g>
<text x="293" y="149" class="head">BACKEND</text><text x="293" y="175" class="info">Java · Spring Boot</text><text x="293" y="195" class="info">APIs e regras de negócio</text>
<path d="M293 220H345" stroke="#A18BFA" stroke-width="3" stroke-linecap="round"/><path d="M354 220H395" stroke="#29425A" stroke-width="3" stroke-linecap="round"/>
</g>
<g>
<rect x="513" y="70" width="213" height="169" rx="16" class="panel pulse" style="animation-delay:-1.4s"/>
<rect x="530" y="88" width="42" height="25" rx="8" fill="#34304D"/><text x="543" y="105" class="num">03</text>
<rect x="664" y="91" width="36" height="27" rx="4" stroke="#83B9FF" stroke-width="2" fill="none" class="scan"/><path d="M670 99h24M679 111h13" stroke="#83B9FF" stroke-width="2"/>
<text x="532" y="149" class="head">FRONTEND</text><text x="532" y="175" class="info">Angular · TypeScript</text><text x="532" y="195" class="info">Interfaces intuitivas</text>
<path d="M532 220H590" stroke="#83B9FF" stroke-width="3" stroke-linecap="round"/><path d="M599 220H635" stroke="#29425A" stroke-width="3" stroke-linecap="round"/>
</g>
<g>
<rect x="752" y="70" width="213" height="169" rx="16" class="panel pulse" style="animation-delay:-2.1s"/>
<rect x="769" y="88" width="42" height="25" rx="8" fill="#1B3D40"/><text x="782" y="105" class="num">04</text>
<circle cx="919" cy="103" r="16" stroke="#5BE7BD" stroke-width="2.8" fill="none" class="scan"/><path d="M909 103l7 7 13-15" stroke="#5BE7BD" stroke-width="2.8" fill="none"/>
<text x="771" y="149" class="head">SOLUÇÃO</text><text x="771" y="175" class="info">Testar, evoluir, entregar</text><text x="771" y="195" class="info">software com propósito</text>
<path d="M771 220H832" stroke="#5BE7BD" stroke-width="3" stroke-linecap="round"/><path d="M842 220H877" stroke="#29425A" stroke-width="3" stroke-linecap="round"/>
</g>
<text x="500" y="271" text-anchor="middle" font="12px Consolas,monospace" fill="#8DA8C3">DESENHAR IDEIAS → ESTRUTURAR SOLUÇÕES → CONSTRUIR EXPERIÊNCIAS</text>
</svg>