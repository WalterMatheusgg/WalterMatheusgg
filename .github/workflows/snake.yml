name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake (light and dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: WalterMatheusgg
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%230B91B2&color_dots=%23EAEFF5,%23D4ECF7,%239CDCEE,%2354BEDA,%230B91B2
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2300D9FF&color_dots=%23161B22,%23163A4B,%23155A70,%230D8CA8,%2300D9FF

      - name: Add decorative snack dots to snake path
        run: python3 .github/scripts/enhance_snake.py dist/github-snake.svg dist/github-snake-dark.svg

      - name: Publish animated SVGs
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
